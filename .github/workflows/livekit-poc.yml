name: LiveKit E2EE POC

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/livekit-poc.yml'
      - 'livekit-poc/**'

jobs:
  poc:
    name: POC ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: livekit-poc-linux
            bin: livekit-poc
          - os: macos-13
            artifact: livekit-poc-macos
            bin: livekit-poc
          - os: windows-latest
            artifact: livekit-poc-windows
            bin: livekit-poc.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-poc -> target

      - name: Build
        working-directory: livekit-poc
        run: cargo build --release

      - name: Run E2EE test
        working-directory: livekit-poc
        run: ./target/release/${{ matrix.bin }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: livekit-poc/target/release/${{ matrix.bin }}
          if-no-files-found: error
