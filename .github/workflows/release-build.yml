name: Release Build Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  frontend-zip:
    name: Frontend Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build frontend dist
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package frontend zip
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/chillgroup-frontend.zip
          (cd frontend && zip -r ../dist/chillgroup-frontend.zip dist)

      - name: Upload frontend zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chillgroup-frontend-${{ github.ref_name || 'dev' }}
          path: dist/chillgroup-frontend.zip
          if-no-files-found: error

  build:
    name: ${{ matrix.mode }} | ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: external
            target: x86_64-unknown-linux-gnu
            target_label: x86_64-linux-gnu
          - mode: embedded
            target: x86_64-unknown-linux-gnu
            target_label: x86_64-linux-gnu
          - mode: external
            target: aarch64-unknown-linux-gnu
            target_label: aarch64-linux-gnu
          - mode: embedded
            target: aarch64-unknown-linux-gnu
            target_label: aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build frontend dist
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build backend (${{ matrix.mode }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = "embedded" ]; then
            cross build --release -p chillgroup-server --target "${{ matrix.target }}" --features embedded-assets
          else
            cross build --release -p chillgroup-server --target "${{ matrix.target }}"
          fi

      - name: Package zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          PACKAGE_NAME="chillgroup-${VERSION}-${{ matrix.mode }}-${{ matrix.target_label }}"
          ARTIFACT_DIR="dist/${PACKAGE_NAME}"
          BIN_PATH="target/${{ matrix.target }}/release/chillgroup-server"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          cp "$BIN_PATH" "$ARTIFACT_DIR/chillgroup-server"
          chmod +x "$ARTIFACT_DIR/chillgroup-server"

          if [ "${{ matrix.mode }}" = "external" ]; then
            # Keep runtime layout for external mode.
            cp -r frontend/dist "$ARTIFACT_DIR/static"
          fi

          (cd dist && zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}")

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chillgroup-${{ github.ref_name || 'dev' }}-${{ matrix.mode }}-${{ matrix.target_label }}
          path: dist/chillgroup-${{ github.ref_name || 'dev' }}-${{ matrix.mode }}-${{ matrix.target_label }}.zip
          if-no-files-found: error

  docker:
    name: Docker Image (multi-arch)
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Download x86_64 embedded artifact
        uses: actions/download-artifact@v4
        with:
          name: chillgroup-${{ github.ref_name || 'dev' }}-embedded-x86_64-linux-gnu
          path: artifacts/x86_64

      - name: Download aarch64 embedded artifact
        uses: actions/download-artifact@v4
        with:
          name: chillgroup-${{ github.ref_name || 'dev' }}-embedded-aarch64-linux-gnu
          path: artifacts/arm64

      - name: Prepare build context
        run: |
          set -euo pipefail
          mkdir -p build-ctx
          unzip artifacts/x86_64/*.zip -d artifacts/x86_64/out
          cp artifacts/x86_64/out/*/chillgroup-server build-ctx/chillgroup-server-amd64
          unzip artifacts/arm64/*.zip -d artifacts/arm64/out
          cp artifacts/arm64/out/*/chillgroup-server build-ctx/chillgroup-server-arm64
          chmod +x build-ctx/chillgroup-server-amd64 build-ctx/chillgroup-server-arm64

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: build-ctx
          file: Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tauri-desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app and publish to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing (skip until Apple Developer account available):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: ChillGroup ${{ github.ref_name }}
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  electron-linux:
    name: Desktop Linux (Electron)
    needs: [tauri-desktop]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Bundle Electron main process
        run: pnpm electron:build-main

      - name: Install pacman build deps
        run: sudo apt-get install -y libarchive-tools

      - name: Build Electron Linux app
        run: pnpm exec electron-builder --linux --publish never

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            dist-electron/*.AppImage \
            dist-electron/*.deb \
            dist-electron/*.rpm \
            dist-electron/*.pacman \
            --clobber

  chillgroup-client:
    name: Client ${{ matrix.target_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_label: linux-x86_64
            bin: chillgroup-client
          - os: windows-latest
            target_label: windows-x86_64
            bin: chillgroup-client.exe
          - os: macos-latest
            target_label: macos-aarch64
            bin: chillgroup-client
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chillgroup-client -> target

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libasound2-dev \
            libglib2.0-dev libv4l-dev clang

      - name: Build chillgroup-client
        run: cargo build --release --manifest-path chillgroup-client/Cargo.toml

      - name: Package zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          PACKAGE_NAME="chillgroup-client-${VERSION}-${{ matrix.target_label }}"
          ARTIFACT_DIR="dist/${PACKAGE_NAME}"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp "chillgroup-client/target/release/${{ matrix.bin }}" "$ARTIFACT_DIR/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}")
          else
            (cd dist && zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}")
          fi

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: chillgroup-client-${{ github.ref_name || 'dev' }}-${{ matrix.target_label }}
          path: dist/chillgroup-client-${{ github.ref_name || 'dev' }}-${{ matrix.target_label }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [build, frontend-zip, chillgroup-client]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish zip files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
