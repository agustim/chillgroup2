name: Release Build Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  frontend-zip:
    name: Frontend Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build frontend dist
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package frontend zip
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/chillgroup-frontend.zip
          (cd frontend && zip -r ../dist/chillgroup-frontend.zip dist)

      - name: Upload frontend zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chillgroup-frontend-${{ github.ref_name || 'dev' }}
          path: dist/chillgroup-frontend.zip
          if-no-files-found: error

  build:
    name: ${{ matrix.mode }} | ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: external
            target: x86_64-unknown-linux-gnu
            target_label: x86_64-linux-gnu
          - mode: embedded
            target: x86_64-unknown-linux-gnu
            target_label: x86_64-linux-gnu
          - mode: external
            target: aarch64-unknown-linux-gnu
            target_label: aarch64-linux-gnu
          - mode: embedded
            target: aarch64-unknown-linux-gnu
            target_label: aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build frontend dist
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build backend (${{ matrix.mode }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = "embedded" ]; then
            cross build --release -p chillgroup-server --target "${{ matrix.target }}" --features embedded-assets
          else
            cross build --release -p chillgroup-server --target "${{ matrix.target }}"
          fi

      - name: Package zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          PACKAGE_NAME="chillgroup-${VERSION}-${{ matrix.mode }}-${{ matrix.target_label }}"
          ARTIFACT_DIR="dist/${PACKAGE_NAME}"
          BIN_PATH="target/${{ matrix.target }}/release/chillgroup-server"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          cp "$BIN_PATH" "$ARTIFACT_DIR/chillgroup-server"
          chmod +x "$ARTIFACT_DIR/chillgroup-server"

          if [ "${{ matrix.mode }}" = "external" ]; then
            # Keep runtime layout for external mode.
            cp -r frontend/dist "$ARTIFACT_DIR/static"
          fi

          (cd dist && zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}")

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chillgroup-${{ github.ref_name || 'dev' }}-${{ matrix.mode }}-${{ matrix.target_label }}
          path: dist/chillgroup-${{ github.ref_name || 'dev' }}-${{ matrix.mode }}-${{ matrix.target_label }}.zip
          if-no-files-found: error

  docker:
    name: Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish Release Assets
    needs: [build, frontend-zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish zip files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
