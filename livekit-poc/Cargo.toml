[package]
name = "livekit-poc"
version = "0.1.0"
edition = "2021"

# Isolated from the workspace
[workspace]

[dependencies]
livekit = { version = "0.7", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.5", features = ["rustls-tls-native-roots", "access-token"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
