# Development: livekit + rustfs + backend (cargo watch) + frontend (pnpm dev)
# Tots els serveis accessibles via localhost. Requereix Linux (network_mode: host).
#
# Ús:
#   docker compose -f docker-compose.dev.yml up
#
# Primera arrencada: cargo-watch es compila una sola vegada i queda al volum cargo-tools.
# Ports:
#   5173 → frontend (Vite dev server)
#   8080 → backend (chillgroup-server)
#   7880 → LiveKit
#   9000 → RustFS S3 API
#   9001 → RustFS consola
#   5432 → PostgreSQL

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.compose
      - .env.compose.local
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chillgroup -d chillgroup"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    command:
      - --bind
      - 0.0.0.0
      - --port
      - "7880"
      - --dev
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    command: /data
    env_file:
      - .env.compose
      - .env.compose.local
    volumes:
      - rustfsdata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: minio/mc:latest
    env_file:
      - .env.compose
      - .env.compose.local
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs $$S3_ENDPOINT $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing rustfs/$$S3_BUCKET
      "
    restart: "no"

  rustfs-cors-init:
    image: amazon/aws-cli:2.22.35
    env_file:
      - .env.compose
      - .env.compose.local
    environment:
      # En dev el navegador carrega l'app des de :5173 (Vite), cal permetre-ho a S3 CORS
      S3_CORS_ALLOWED_ORIGIN_1: http://localhost:5173
      S3_CORS_ALLOWED_ORIGIN_2: http://localhost:8080
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    entrypoint: >
      /bin/sh -c "
      export AWS_ACCESS_KEY_ID=$$S3_ACCESS_KEY_ID &&
      export AWS_SECRET_ACCESS_KEY=$$S3_SECRET_ACCESS_KEY &&
      export AWS_DEFAULT_REGION=$$S3_REGION &&
      export AWS_EC2_METADATA_DISABLED=true &&
      printf '%s' '{\"CORSRules\":[{\"AllowedOrigins\":[\"'\"$$S3_CORS_ALLOWED_ORIGIN_1\"'\",\"'\"$$S3_CORS_ALLOWED_ORIGIN_2\"'\"],\"AllowedMethods\":[\"GET\",\"HEAD\",\"PUT\",\"POST\",\"DELETE\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"x-amz-request-id\"],\"MaxAgeSeconds\":3600}]}' > /tmp/cors.json &&
      aws --endpoint-url $$S3_ENDPOINT s3api put-bucket-cors --bucket $$S3_BUCKET --cors-configuration file:///tmp/cors.json
      "
    restart: "no"

  backend:
    image: rust:1-bookworm
    network_mode: host
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-tools:/cargo-tools
      - target-cache:/app/target
    env_file:
      - .env.compose
      - .env.compose.local
    environment:
      # Override: backend corre amb host network, ha d'usar localhost en comptes de noms de servei
      DATABASE_URL: postgres://chillgroup:chillgroup@localhost:5432/chillgroup?sslmode=disable
      S3_ENDPOINT: http://localhost:9000
      LIVEKIT_HOST: http://localhost:7880
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      rustfs-cors-init:
        condition: service_completed_successfully
    command: >
      bash -c "
      if [ ! -f /cargo-tools/bin/cargo-watch ]; then
        echo '>>> Instal·lant cargo-watch (primera vegada)...' &&
        cargo install cargo-watch --locked --root /cargo-tools;
      fi &&
      export PATH=/cargo-tools/bin:$$PATH &&
      cargo watch -w server/ -w Cargo.toml -w Cargo.lock -x 'run -p chillgroup-server'
      "

  frontend:
    image: node:20-bookworm-slim
    network_mode: host
    working_dir: /app/frontend
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm
      - frontend-modules:/app/frontend/node_modules
    env_file:
      - .env.compose
      - .env.compose.local
    depends_on:
      - backend
    command: >
      bash -c "
      corepack enable &&
      corepack prepare pnpm@9.15.5 --activate &&
      pnpm install &&
      pnpm run dev
      "

volumes:
  pgdata:
  rustfsdata:
  cargo-registry:
  cargo-git:
  cargo-tools:
  target-cache:
  pnpm-store:
  frontend-modules: