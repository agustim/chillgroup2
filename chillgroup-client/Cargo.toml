[package]
name = "chillgroup-client"
version = "0.1.52"
edition = "2021"

[workspace]
# Isolated from root workspace to avoid pulling livekit into all cargo builds

[dependencies]
# UI
slint = "1.16"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# HTTP REST
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Socket.IO
rust_socketio = { version = "0.6", features = ["async"] }

# LiveKit (audio/video/E2EE) — target-specific below (glib-main-loop = Linux only)

# Vault encryption
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"

# E2EE missatges — Phase 2
ml-kem = { version = "0.3", features = ["getrandom"] }
ml-dsa = { version = "0.1", features = ["getrandom"] }

# Vault local
sled = "0.34"

# Configuració
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Tray icon — Phase 2
# tray-icon = "0.24"

# Notificacions
notify-rust = "4"

# Webcam capture — target-specific backend below

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5"
base64 = "0.22"

# Platform-specific: webcam backend + livekit main-loop integration
[target.'cfg(target_os = "linux")'.dependencies]
livekit = { version = "0.7", features = ["native-tls", "glib-main-loop"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
livekit = { version = "0.7", features = ["native-tls"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-avfoundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
livekit = { version = "0.7", features = ["native-tls"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }

[build-dependencies]
slint-build = "1.16"
