services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.compose
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chillgroup -d chillgroup"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    command:
      - --bind
      - 0.0.0.0
      - --port
      - "7880"
      - --dev
    # Linux only: avoids spawning docker-proxy processes for each published UDP port.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    command: /data
    env_file:
      - .env.compose
    volumes:
      - rustfsdata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: minio/mc:latest
    env_file:
      - .env.compose
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs $$S3_ENDPOINT $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing rustfs/$$S3_BUCKET
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.compose
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

volumes:
  pgdata:
  rustfsdata: