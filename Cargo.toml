[workspace]
resolver = "2"
members = ["server", "shared"]

[workspace.dependencies]
# Web
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
socketioxide = "0.18"
hyper = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "time", "json"] }

# Cryptography
argon2 = "0.5"
rand = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Auth
jsonwebtoken = "9"
base64 = "0.22"

# Config
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for LiveKit API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# S3 client (attachments presigned URLs)
aws-sdk-s3 = "1"
aws-credential-types = "1"

# Utilities
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

# Test dependencies
axum-test = "18"
tokio-test = "0.4"
tempfile = "3.14"